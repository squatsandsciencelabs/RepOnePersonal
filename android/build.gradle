// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "30.0.2"
        minSdkVersion = 28 // react-native-ble-manager wants >= 19, unimodules wants >= 21
        compileSdkVersion = 31
        targetSdkVersion = 31
        ndkVersion = "21.4.7075529"
        // googlePlayServicesAuthVersion = "19.2.0" // react-native-google-signin
        firebaseIidVersion = "19.0.1" // react-native-device-info
        kotlinVersion = '1.6.20'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:7.3.0')
        // classpath 'com.google.gms:google-services:4.3.14' // react-native-google-signin
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        // classpath 'com.google.firebase:firebase-crashlytics-gradle:2.8.1' // react-native-firebase crashlytics
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        mavenCentral {
            // We don't want to fetch react-native from Maven Central as there are
            // older versions over there.
            content {
                excludeGroup "com.facebook.react"
            }
        }
        google()
        maven { url 'https://www.jitpack.io' }
        jcenter() {
            // temporary for react-native-video, need to migrate away from jcenter at some point
            content {
                includeModule("com.yqritc", "android-scalablevideoview")
            }
        }
    }
}
