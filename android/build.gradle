// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "31.0.0"
        minSdkVersion = 28 // the "minimum" droid OS that can use this app. react-native-ble-manager wants >= 19, unimodules wants >= 21
        compileSdkVersion = 33 // what compile with, which means "maximum" as well as you must compile against new features
        targetSdkVersion = 33 // for forward compatibility, features in versions above this will be disabled
        // googlePlayServicesAuthVersion = "19.2.0" // react-native-google-signin
        firebaseIidVersion = "19.0.1" // react-native-device-info
        kotlinVersion = '1.6.20' // expo needs this, https://github.com/expo/expo/issues/19338

        if (System.properties['os.arch'] == "aarch64") {
            // For M1 Users we need to use the NDK 24 which added support for aarch64
            ndkVersion = "24.0.8215888"
        } else {
            // Otherwise we default to the side-by-side NDK version from AGP.
            ndkVersion = "21.4.7075529"
        }
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.2.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("de.undercouch:gradle-download-task:5.0.1")
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        // classpath 'com.google.gms:google-services:4.3.14' // react-native-google-signin
        // classpath 'com.google.firebase:firebase-crashlytics-gradle:2.8.1' // react-native-firebase crashlytics
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" // expo needs this, https://github.com/expo/expo/issues/19338 
    }
}

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        mavenCentral {
            // We don't want to fetch react-native from Maven Central as there are
            // older versions over there.
            content {
                excludeGroup "com.facebook.react"
            }
        }
        google()
        maven { url 'https://www.jitpack.io' }
        jcenter() {
            // temporary for react-native-video, need to migrate away from jcenter at some point
            content {
                includeModule("com.yqritc", "android-scalablevideoview")
            }
        }
    }
}
